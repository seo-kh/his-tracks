<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Google 로그인 완료</title>
  <style>
    body { margin: 0; background: #111; color: #e0e0e0; font-family: -apple-system, sans-serif;
      display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; }
    p { font-size: 15px; color: #8e8e93; }
  </style>
</head>
<body>
  <div>
    <p>로그인이 완료되었습니다.<br>이 창은 자동으로 닫힙니다.</p>
  </div>
  <script>
    (function () {
      var hash = window.location.hash.substring(1);
      var query = window.location.search.substring(1);

      function parseParams(str) {
        var params = {};
        str.split('&').forEach(function (pair) {
          var kv = pair.split('=');
          if (kv[0]) params[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
        });
        return params;
      }

      // Implicit flow — token in hash
      if (hash) {
        var p = parseParams(hash);
        if (p.access_token) {
          window.opener && window.opener.postMessage(
            { type: 'GOOGLE_OAUTH_TOKEN', access_token: p.access_token, expires_in: p.expires_in },
            window.location.origin
          );
          window.close();
          return;
        }
        if (p.error) {
          window.opener && window.opener.postMessage(
            { type: 'GOOGLE_OAUTH_TOKEN', error: p.error },
            window.location.origin
          );
          window.close();
          return;
        }
      }

      // PKCE / Authorization Code flow — code in query string
      if (query) {
        var q = parseParams(query);
        if (q.code) {
          window.opener && window.opener.postMessage(
            { type: 'GOOGLE_OAUTH_CODE', code: q.code },
            window.location.origin
          );
          window.close();
          return;
        }
        if (q.error) {
          window.opener && window.opener.postMessage(
            { type: 'GOOGLE_OAUTH_CODE', error: q.error },
            window.location.origin
          );
          window.close();
          return;
        }
      }
    })();
  </script>
</body>
</html>
